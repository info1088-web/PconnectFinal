<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập - Pconnect</title>
  <link rel="stylesheet" href="./css/dnhap.css" />
</head>
<body>
  <!-- HEADER: logo của trang đăng nhập -->
  <header class="auth-header">
    <div class="logo">Pconnect</div>
  </header>

  <!-- MAIN: form đăng nhập bằng Firebase Auth -->
  <main class="auth-main">
    <form class="card" id="loginForm">
      <h2>Đăng nhập</h2>

      <div class="input-group">
        <input type="email" placeholder=" " id="email" required />
        <label>Email</label>
      </div>

      <div class="input-group password-group">
        <input type="password" placeholder=" " id="password" required />
        <label>Mật khẩu</label>
        <button type="button" onclick="togglePassword()">👁️</button>
      </div>

      <p id="error" class="error-message"></p>

      <button type="submit">Đăng nhập</button>

      <p>Chưa có tài khoản? <a href="./dki.html">Đăng ký</a></p>
    </form>
  </main>

  <!-- FOOTER: thông tin cơ bản của Pconnect -->
  <footer class="auth-footer">
    <p>© 2026 Pconnect</p>
    <p>Nhà sáng lập: Phúc & Phước</p>
    <p>Hotline: 0123 456 789</p>
  </footer>

  <!-- Ẩn/hiện mật khẩu -->
  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>

  <!-- Script xử lý đăng nhập -->
  <script type="module" src="./js/dnhap.js"></script>
</body>
</html>
