<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng ký - Pconnect</title>
  <link rel="stylesheet" href="./css/dki.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- HEADER: logo của trang đăng ký -->
  <header class="auth-header">
    <div class="logo">Pconnect</div>
  </header>

  <!-- MAIN: form đăng ký và lưu tên hiển thị vào Firebase Profile -->
  <main class="auth-main">
    <form class="card" id="registerForm">
      <h2>Tạo tài khoản</h2>

      <div class="input-group">
        <input type="text" id="displayName" placeholder=" " required />
        <label>Tên của bạn</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" placeholder=" " required />
        <label>Email</label>
      </div>

      <div class="input-group password-group">
        <input type="password" id="password" placeholder=" " required />
        <label>Mật khẩu</label>
        <button type="button" onclick="togglePassword()">👁️</button>
      </div>

      <button type="submit" id="registerBtn">Đăng ký</button>

      <p>Đã có tài khoản? <a href="dnhap.html">Đăng nhập</a></p>
    </form>
  </main>

  <!-- FOOTER: thông tin cơ bản của Pconnect -->
  <footer class="auth-footer">
    <p>© 2026 Pconnect</p>
    <p>Nhà sáng lập: Phúc & Phước</p>
    <p>Hotline: 0123 456 789</p>
  </footer>

  <!-- Ẩn/hiện mật khẩu -->
  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>

  <!-- Script xử lý đăng ký -->
  <script type="module" src="Auth/dki-auth.js"></script>
</body>
</html>
